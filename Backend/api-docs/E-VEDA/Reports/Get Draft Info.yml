info:
  name: Get Draft Info
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/report/draft-info"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}/api/report/draft-info"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-credentials
          value: "true"
        - name: access-control-allow-headers
          value: Content-Type, Authorization
        - name: access-control-allow-methods
          value: GET, POST, PUT, DELETE, OPTIONS
        - name: access-control-allow-origin
          value: http://localhost:5173
        - name: content-type
          value: application/json
        - name: date
          value: Mon, 13 Apr 2026 18:17:11 GMT
        - name: content-length
          value: "63"
      body:
        type: json
        data: |-
          {
            "patient_name": "Ansh Sharma",
            "projected_next_id": "#EV-00006"
          }
