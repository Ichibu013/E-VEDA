info:
  name: Get Profile
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/user"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Not Found Error
    request:
      url: "{{base_url}}/api/user"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json
        - name: date
          value: Fri, 10 Apr 2026 11:26:38 GMT
        - name: content-length
          value: "69"
      body:
        type: json
        data: |-
          {
            "error": "Not Found",
            "message": "Internal server error",
            "status": 404
          }
  - name: Sucess response for new user
    request:
      url: "{{base_url}}/api/user"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-credentials
          value: "true"
        - name: access-control-allow-headers
          value: Content-Type, Authorization
        - name: access-control-allow-methods
          value: GET, POST, PUT, DELETE, OPTIONS
        - name: access-control-allow-origin
          value: http://localhost:5173
        - name: content-type
          value: application/json
        - name: date
          value: Fri, 10 Apr 2026 13:38:34 GMT
        - name: content-length
          value: "88"
      body:
        type: json
        data: |-
          {
            "age": 0,
            "height": 0,
            "name": "Ansh Sharma",
            "nickname": "",
            "profile_picture": "",
            "weight": 0
          }
  - name: Complete Response
    request:
      url: "{{base_url}}/api/user"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-credentials
          value: "true"
        - name: access-control-allow-headers
          value: Content-Type, Authorization
        - name: access-control-allow-methods
          value: GET, POST, PUT, DELETE, OPTIONS
        - name: access-control-allow-origin
          value: http://localhost:5173
        - name: content-type
          value: application/json
        - name: date
          value: Fri, 10 Apr 2026 13:41:59 GMT
        - name: content-length
          value: "185"
      body:
        type: json
        data: |-
          {
            "age": 28,
            "height": 158,
            "name": "Ansh Sharma",
            "nickname": "Ansh",
            "profile_picture": "http://localhost:9000/e-veda-profiles/4caca9f3-8252-4f70-ae98-8dff36381380-5757f376.jpg",
