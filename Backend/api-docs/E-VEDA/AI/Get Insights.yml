info:
  name: Get Insights
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/ai/insight"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}/api/ai/insight"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-credentials
          value: "true"
        - name: access-control-allow-headers
          value: Content-Type, Authorization
        - name: access-control-allow-methods
          value: GET, POST, PUT, DELETE, OPTIONS
        - name: access-control-allow-origin
          value: http://localhost:5173
        - name: content-type
          value: application/json
        - name: date
          value: Sun, 12 Apr 2026 11:12:22 GMT
        - name: content-length
          value: "302"
      body:
        type: json
        data: |-
          {
            "details": "By logging your daily emotional state, the AI can detect patterns and correlations, offering you customized advice to help stabilize and improve your overall wellbeing.",
            "insight": "Welcome to your emotional journey. Start recording your daily updates to receive personalized AI insights."
          }
