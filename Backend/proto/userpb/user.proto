// proto/user.proto
syntax = "proto3";
package user;
option go_package = "e_veda/proto/userpb";

service UserService {
  rpc CreateUser (CreateUserRequest) returns (ApiResponse);
  rpc GetUser (GetUserRequest) returns (UserResponse);
}

message CreateUserRequest {
  string user_id = 1;
  string name = 2;
  string email = 3;
}

message ApiResponse {
  string message = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
}