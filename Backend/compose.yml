# Use a more recent version
version: '3.8'

# Define persistent storage for MongoDB and Maven cache
volumes:
  mongo_data:
  maven_cache:

services:
  mongodb:
    image: 'mongo:latest'
    container_name: mongodb
    ports:
      - '27017:27017'
    healthcheck:
      # Use `mongosh` for the health check.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # Map named volume for persistent data
      - 'mongo_data:/data/db'

  gateway:
    # Use a new Dockerfile specifically for development
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
      - "5005:5005" # This is important for debugging
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # Map the entire project source code for hot-reloading
      - ./Gateway:/app/Gateway:ro
      - ./API:/app/API:ro
      - ./Common:/app/Common:ro
      # Cache Maven dependencies to avoid re-downloading
      - maven_cache:/root/.m2
    working_dir: /app/Gateway
    command: mvn spring-boot:run
    environment:
      SPRING_DATA_MONGODB_URI: 'mongodb://mongodb:27017/e_veda'
