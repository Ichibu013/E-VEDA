# Automatically upgrade HTTP to HTTPS
server {
    listen 80;
    server_name eveda.in www.eveda.in;
    return 301 https://$host$request_uri;
}

# Unified Secure Gateway
server {
    listen 443 ssl;
    http2 on;
    server_name eveda.in www.eveda.in;

    # Global upload ceiling for the secure gateway (Handles videos up to 200MB)
    client_max_body_size 200M;

    # Paths mapped inside your Nginx Proxy container via volume maps
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 1. ROUTE TO FRONTEND
    location / {
        proxy_pass http://frontend:80; # Direct to internal frontend container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. ROUTE TO BACKEND GATEWAY (Assumes your client-side code hits /api/...)
    location /api/ {
        proxy_pass http://api-gateway:8080; # Forward down to Go API Gateway
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for interactive streaming payloads
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

	# 3. ROUTE FOR PUBLIC MINIO DOWNLOADS
	location /minio-storage/ {
        # Strip '/minio-storage/' from the path before passing to MinIO
        rewrite ^/minio-storage/(.*)$ /$1 break;
        
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optimizations for downloading large video/audio streams
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
