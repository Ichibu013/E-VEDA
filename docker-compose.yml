
services:
  # ---------------------------------------------------------------------------
  # Core Infrastructure & Databases (Bound to local loopback for safety)
  # ---------------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: e_veda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: e_veda
    ports:
      - "127.0.0.1:5433:5432" # Safe: Only accessible from the host itself or SSH tunnel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e_veda"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e_veda_net

  redis:
    image: redis:7-alpine
    container_name: e_veda_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379" # Safe loopback restriction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - e_veda_net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: e_veda_minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      # Fixed: Swapped missing curl with native MinIO check utility
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - e_veda_net

  minio-setup:
    image: minio/mc:latest
    container_name: e_veda_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - e_veda_net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/e-veda-profiles --ignore-existing;
      mc anonymous set download myminio/e-veda-profiles;
      mc mb myminio/e-veda-videos --ignore-existing;
      mc anonymous set download myminio/e-veda-videos;
      mc mb myminio/e-veda-audios --ignore-existing;
      mc anonymous set download myminio/e-veda-audios;
      exit 0;
      "

  # ---------------------------------------------------------------------------
  # Go Backend Services (Internal Network Resolution Only)
  # ---------------------------------------------------------------------------
  iam-service:
    build:
      context: ./Backend
      dockerfile: iam-service/Dockerfile
    container_name: e_veda_iam_service
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:-root}@postgres-db:5432/e_veda?sslmode=disable
      - REDIS_URL=redis:6379
    expose:
      - "50052"
    networks:
      - e_veda_net

  user-service:
    build:
      context: ./Backend
      dockerfile: user-service/Dockerfile
    container_name: e_veda_user_service
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:-root}@postgres-db:5432/e_veda?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
    expose:
      - "50051"
    networks:
      - e_veda_net

  api-gateway:
    build:
      context: ./Backend
      dockerfile: api-gateway/Dockerfile
    container_name: e_veda_api_gateway
    restart: unless-stopped
    depends_on:
      iam-service:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      - IAM_SERVICE_URL=iam-service:50052
      - USER_SERVICE_URL=user-service:50051
    expose:
      - "8080"
    networks:
      - e_veda_net

  # ---------------------------------------------------------------------------
  # Python AI FastAPI System
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./aiSystem
      dockerfile: Dockerfile
    container_name: e_veda_ai_service
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - e_veda_net

  # ---------------------------------------------------------------------------
  # Production Frontend (Hidden Internally)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: e_veda_frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    volumes:
      # This overwrites the broken container config with our clean configuration
      - ./frontend.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - e_veda_net

  # ---------------------------------------------------------------------------
  # Cloudflare Reverse Proxy Guard (The Front Door)
  # ---------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:alpine
    container_name: e_veda_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"   # Open to Cloudflare
      - "443:443" # Open to Cloudflare
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro # Contains your cert.pem and key.pem
    networks:
      - e_veda_net
    depends_on:
      - frontend

networks:
  e_veda_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
